services:
  # PostgreSQL Database
  - type: pserv
    name: greenroom-db
    env: docker
    plan: free
    region: singapore
    databases:
      - name: greenroom
        ipAllowList: []

  # Next.js Application
  - type: web
    name: greenroom-app
    env: node
    plan: free
    region: singapore
    buildCommand: npm run build
    startCommand: npm run start
    healthCheckPath: /api/health/db
    envVars:
      - key: NODE_ENV
        value: production
      - key: DIRECT_URL
        fromDatabase:
          name: greenroom
          property: connectionString
      - key: DATABASE_URL
        fromDatabase:
          name: greenroom
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false
